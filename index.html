<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Free Likes Generator 🚀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce-slow {
            animation: bounce-slow 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center font-sans overflow-hidden">

    <!-- Main Container -->
    <div id="app" class="relative z-10 w-full max-w-md p-8 bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl text-center">
        
        <!-- Header -->
        <div class="mb-6">
            <div class="inline-block p-3 bg-gradient-to-tr from-pink-500 to-cyan-400 rounded-full mb-3 animate-bounce-slow">
                <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19.589 6.686a4.793 4.793 0 0 1-3.77-4.245V2h-3.45v13.672a2.896 2.896 0 0 1-5.201 1.743l-.002-.001.002-.001a2.895 2.895 0 0 1 3.193-4.524v-3.48a6.345 6.345 0 0 0-5.839 8.874 6.347 6.347 0 0 0 9.878-1.579V9.112a8.17 8.17 0 0 0 4.717 1.492v-3.472c-.52 0-1.034-.143-1.484-.446z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">TikTok VIP Booster</h1>
            <p class="text-xs text-zinc-400 mt-1">Get 10,000 instant likes & followers for free!</p>
        </div>

        <!-- Form -->
        <form id="prankForm" onsubmit="triggerPrank(event)" class="space-y-4 text-left">
            <div>
                <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">TikTok Username</label>
                <input type="text" id="username" required placeholder="@username" 
                    class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:border-pink-500 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Select Likes Amount</label>
                <select class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white focus:outline-none focus:border-pink-500 transition">
                    <option>1,000 Likes</option>
                    <option>5,000 Likes</option>
                    <option selected>10,000 Likes (VIP)</option>
                    <option>50,000 Likes (God Mode)</option>
                </select>
            </div>

            <button type="submit" 
                class="w-full py-3.5 mt-2 bg-gradient-to-r from-pink-500 to-cyan-400 font-bold rounded-xl text-white shadow-lg hover:opacity-90 active:scale-95 transition">
                Generate Likes Now ⚡
            </button>
        </form>
    </div>

    <!-- Prank Success Screen (Hidden by default) -->
    <div id="prankResult" class="hidden fixed inset-0 bg-black/95 z-50 flex flex-col items-center justify-center p-6 text-center">
        <div class="text-6xl mb-4 animate-bounce">😂</div>
        <h2 id="victimTitle" class="text-3xl font-black text-pink-500 mb-2">GOTCHA!</h2>
        <p class="text-lg text-zinc-300 max-w-sm mb-3">There are no free likes, buddy! You just got completely pranked. Better luck next time! 🥷</p>
        <p class="text-xl font-bold text-cyan-400 mb-6 tracking-wide">lul ty charo dani dy</p>
        <button onclick="resetPrank()" class="px-6 py-3 bg-zinc-800 hover:bg-zinc-700 font-semibold rounded-xl text-white transition">
            Try Again / Prank Someone Else
        </button>
    </div>

    <script>
        function triggerPrank(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            
            // Customize the message with their entered username
            document.getElementById('victimTitle').innerText = `GOTCHA, ${username}! 🎉`;
            
            // Show the funny screen
            document.getElementById('prankResult').classList.remove('hidden');
        }

        function resetPrank() {
            document.getElementById('prankResult').classList.add('hidden');
            document.getElementById('prankForm').reset();
        }
    </script>
</body>
</html>
